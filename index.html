(function(root,factory){const v=factory();if(typeof module==='object'&&module.exports)module.exports=v;root.SurebetEngine=v;})(typeof globalThis==='object'?globalThis:this,function(){

 const payout=leg=>money(number(leg.stake)*number(leg.odd)-number(leg.freebet));
 const legs=bet=>Array.isArray(bet.legs)?bet.legs:[];
 const totalOwn=bet=>money(legs(bet).reduce((s,l)=>s+own(l),0));
 const scenarioIndices=bet=>bet.type==='2plus3'?[[0],[1,2]]:bet.type==='3way'?[[0],[1],[2]]:[[0],[1]];
 const payoutFor= (bet,winner)=>{
  if(winner==='open'||winner==null||winner==='')return 0;
  let indices=(bet.type==='2plus3'&&(String(winner)==='23'||String(winner)==='2'||String(winner)==='3'))?[1,2]:[Number(winner)-1];
  return money(indices.reduce((s,i)=>s+(legs(bet)[i]?payout(legs(bet)[i]):0),0));
 };
 const settled=bet=>bet.winner!==''&&bet.winner!=null&&String(bet.winner)!=='open';
 const profit=bet=>settled(bet)?money(payoutFor(bet,bet.winner)-totalOwn(bet)):null;

  if(legs(bet).length<(bet.type==='2way'?2:3))return null;
  const cost=totalOwn(bet);
  return money(Math.min(...scenarioIndices(bet).map(group=>group.reduce((s,i)=>s+payout(legs(bet)[i]),0)))-cost);
 };
 const winners=bet=>!settled(bet)?[]:(bet.type==='2plus3'&&['23','2','3'].includes(String(bet.winner))?[1,2]:[Number(bet.winner)-1]);
 const allBooks=data=>{const seen=new Map();const add=name=>{let s=String(name||'').trim();if(s&&!seen.has(key(s)))seen.set(key(s),s)};(data.books||[]).forEach(b=>add(b.name));(data.bets||[]).forEach(b=>legs(b).forEach(l=>add(l.book)));(data.flows||[]).forEach(f=>add(f.book));(data.casinos||[]).forEach(c=>add(c.book));return [...seen.values()];};
 const perBook=(data,name)=>{
  let k=key(name), flows=(data.flows||[]).filter(f=>key(f.book)===k), casino=(data.casinos||[]).filter(c=>key(c.book)===k);

   legs(b).forEach((l,i)=>{

   });
  });

 };

  return {bets:bets.length,open:bets.filter(b=>!settled(b)).length,closed:bets.filter(settled).length,betProfit,casinoProfit,totalProfit:money(betProfit+casinoProfit),available:money(books.reduce((s,b)=>s+b.available,0)),openStake:stakeOpen,portfolio:money(books.reduce((s,b)=>s+b.total,0)),netDeposits:money(books.reduce((s,b)=>s+b.net,0)),settledStake,roi:settledStake?money(100*betProfit/settledStake):0,books};
 };
 function calculator(type,odds,budget,freebets,existing,roundTo=1){

 if(betWizardStep===1&&(!g('date')||!g('event').trim()))msg='Vul de datum en een omschrijving in.';
 if([2,3,4].includes(betWizardStep)){const i=betWizardStep-2,o=num(g('odd'+i)),st=num(g('stake'+i)),free=num(g('free'+i));if(!g('book'+i)||o<=1||st<=0||free<0||free>st)msg='Vul bookmaker, odd > 1 en totale inzet > 0 in. Freebet mag niet hoger zijn dan de inzet.';}
 if(msg){formError(msg);return false;}return true;
}
function stepWizard(dir){const steps=wizardSteps(),at=steps.indexOf(betWizardStep);if(dir>0&&!validateWizardStep())return;betWizardStep=steps[Math.max(0,Math.min(steps.length-1,at+dir))];showWizard();}
function legInputs(i,l,books){l=l||{book:books[0]||'',odd:'',stake:'',freebet:0};return `<div class="span2">${formSelect('Bookmaker','book'+i,books,l.book)}</div>${field('Odd','odd'+i,l.odd,'text','required placeholder="Bijv. 2,85"')}${field('Totale inzet (€)','stake'+i,l.stake,'text','required placeholder="Bijv. 50"')}<div class="span2">${field('Waarvan freebet (€)','free'+i,l.freebet,'text','placeholder="0"')}</div>`}
function fixWinOptions(){const f=document.getElementById('entry-form');if(!f||f.dataset.kind!=='bet')return;
 const type=f.elements.type.value,sel=f.elements.winner,cur=sel.value;
 const allowed=type==='2way'?['open','1','2']:type==='3way'?['open','1','2','3']:['open','1','23'];
 for(const o of sel.options){o.hidden=!allowed.includes(o.value);o.disabled=o.hidden;}
 if(!allowed.includes(cur))sel.value='open';
 if(!wizardSteps().includes(betWizardStep))betWizardStep=5;
 showWizard();
}
function marginWarnings(b,excludedId){
 const r=E.report(data),warnings=[];
 const scenarioGroups=bet=>bet.type==='3way'?[[0],[1],[2]]:bet.type==='2plus3'?[[0],[1,2]]:[[0],[1]];
 const outcomeRange=(bet,k)=>{
  const idx=bet.legs.map((l,i)=>E.key(l.book)===k?i:-1).filter(i=>i>=0);
  if(!idx.length)return [0,0];
  const results=scenarioGroups(bet).map(win=>E.money(idx.reduce((v,i)=>v+(win.includes(i)?E.payout(bet.legs[i]):0)-E.own(bet.legs[i]),0)));
  return [Math.min(...results),Math.max(...results)];
 };
 for(const book of data.books){
  const maxP=book.maxProfit==null||book.maxProfit===''?null:num(book.maxProfit);
  const maxL=book.maxLoss==null||book.maxLoss===''?null:num(book.maxLoss);
  if(maxP===null&&maxL===null)continue;
  const k=E.key(book.name),old=data.bets.find(x=>x.id===excludedId);
  let base=r.books.find(x=>E.key(x.name)===k)?.profit||0;
  if(old&&E.settled(old)){
   base-=old.legs.reduce((v,l,i)=>v+(E.key(l.book)===k?((E.winners(old).includes(i)?E.payout(l):0)-E.own(l)):0),0);
  }
  let outstandingMin=0,outstandingMax=0;
  for(const pending of data.bets){if(E.settled(pending)||pending.id===excludedId)continue;const [mn,mx]=outcomeRange(pending,k);outstandingMin+=mn;outstandingMax+=mx;}
  const [newMin,newMax]=outcomeRange(b,k);
  if(newMin===0&&newMax===0)continue;
  const min=E.money(base+outstandingMin+newMin),max=E.money(base+outstandingMax+newMax);
  if(maxP!==null&&max>maxP+.009)warnings.push(`${book.name}: mogelijk cumulatief resultaat ${euro(max)} > winstmarge ${euro(maxP)}`);
  if(maxL!==null&&min< -maxL-.009)warnings.push(`${book.name}: mogelijk cumulatief resultaat ${euro(min)} < verliesgrens −${euro(maxL)}`);
 }
 return [...new Set(warnings)];
}
function updateBetPreview(){
 const f=document.getElementById('entry-form');if(!f||f.dataset.kind!=='bet')return;
 const type=f.elements.type.value,count=type==='2way'?2:3;
 const legs=[...Array(count)].map((_,i)=>({book:f.elements['book'+i].value,odd:num(f.elements['odd'+i].value),stake:num(f.elements['stake'+i].value),freebet:num(f.elements['free'+i].value)}));
 for(let i=0;i<3;i++){const label=document.getElementById('leg-own-'+i);if(label)label.textContent=i<count?'Eigen inzet '+euro(E.own(legs[i])):'Eigen inzet —';}
 const panel=document.getElementById('bet-live-summary');if(!panel)return;
 const good=legs.every(l=>l.book&&l.odd>1&&l.stake>0&&l.freebet>=0&&l.freebet<=l.stake);
 if(!good){panel.innerHTML='<span class="muted">Vul voor alle actieve bets bookmaker, odd en totale inzet in. Freebet mag niet hoger zijn dan de inzet.</span>';return;}
 const b={type,legs,winner:f.elements.winner.value};
 const own=E.totalOwn(b),free=E.money(legs.reduce((s,l)=>s+l.freebet,0)),expected=E.expectedMin(b),actual=E.profit(b);
 panel.innerHTML=`<div class="bet-summary-stats"><div><span>Eigen geld</span><strong>${euro(own)}</strong></div><div><span>Gebruikte freebets</span><strong>${euro(free)}</strong></div><div><span>Minimumwinst</span><strong class="${currencyClass(expected)}">${euro(expected)}</strong></div></div>${actual===null?'<p class="helper">Minimale verwachte winst, ongeacht welke uitkomst wint.</p>':`<div class="bet-actual-preview">Resultaat bij gekozen winnaar: <b class="${currencyClass(actual)}">${euro(actual)}</b></div>`}`;
 const warnings=marginWarnings(b,f.dataset.id);const margin=document.getElementById('bet-margin-warning');if(margin)margin.innerHTML=warnings.length?`<div class="banner warn"><b>Let op: ingestelde bookmakergrenzen</b><ul>${warnings.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div>`:'<div class="banner">Geen ingestelde boekmakergrenzen overschreden in de doorgerekende scenario’s.</div>';
}
function openBook(name,checking=false){const existing=data.books.find(b=>E.key(b.name)===E.key(name));if(checking&&!existing)return;const body=`<form id="entry-form" data-kind="${checking?'check':'book'}" data-old="${esc(name||'')}">${checking?`<p class="helper" style="margin-bottom:15px">Vul alleen het <b>werkelijk direct opneembare saldo</b> bij ${esc(name)} in.</p>${field('Echt opneembaar (€)','actual',existing?.actual??'')}`:field('Naam goksite','name',name||'','text','required inputmode="text"')}<p class="form-error" id="form-error"></p></form>`;modal(checking?'Saldocontrole: '+name:name?'Bookmaker wijzigen':'Bookmaker toevoegen',body);}
function openFlow(rec){const edit=!!rec;rec=rec||{date:today(),book:E.allBooks(data)[0],type:'deposit',amount:'',note:''};modal(edit?'Mutatie wijzigen':'Nieuwe storting / opname',`<form id="entry-form" data-kind="flow" data-id="${esc(rec.id||'')}"><div class="formgrid">${field('Datum','date',rec.date||today(),'date')}${formSelect('Bookmaker','book',E.allBooks(data),rec.book)}${formSelect('Soort','type',['deposit','withdrawal'],rec.type)}${field('Bedrag (€)','amount',rec.amount,'text','required')}<div class="span2">${field('Opmerking','note',rec.note,'text','inputmode="text"')}</div></div><p class="form-error" id="form-error"></p></form>`);if(edit)insertDelete();}
function openCasino(rec){const edit=!!rec;rec=rec||{date:today(),book:E.allBooks(data)[0]||'',category:'casino',amount:'',note:''};
 modal(edit?'Bijzondere mutatie wijzigen':'Bijzondere mutatie toevoegen',`<form id="entry-form" data-kind="casino" data-id="${esc(rec.id||'')}"><div class="formgrid">${field('Datum','date',rec.date||today(),'date')}${formSelect('Soort','category',['casino','service','promotion','other'],rec.category||'casino')}${formSelect('Bookmaker (optioneel)','book',['',...E.allBooks(data)],rec.book||'')}${field('Bedrag (+ opbrengst / − kosten)','amount',rec.amount,'text','required')}<div class="span2">${field('Omschrijving','note',rec.note,'text','inputmode="text"')}</div></div><p class="helper" style="margin-top:12px">Negatieve bedragen voor kosten (bijvoorbeeld <b>-19,95</b>). Zonder bookmaker telt de mutatie alleen mee in het totale resultaat, niet in de portefeuille van een goksite.</p><p class="form-error" id="form-error"></p></form>`);if(edit)insertDelete();}
function settleBet(b){const choices=b.type==='2way'?[['1','Bet 1'],['2','Bet 2']]:b.type==='3way'?[['1','Bet 1'],['2','Bet 2'],['3','Bet 3']]:[['1','Bet 1'],['23','Bet 2 + 3']];
 modal('Uitslag: '+b.event,`<form id="entry-form" data-kind="settle" data-id="${esc(b.id)}"><p class="helper">Kies de winnende bookmaker. Je ziet meteen de uitbetaling en netto winst.</p><div class="winner-choice">${choices.map(([v,label])=>{const temp={...b,winner:v};return `<label class="winner-option"><input type="radio" name="winner" value="${v}" ${v===choices[0][0]?'checked':''}><span><b>${esc(v==='23'?b.legs.slice(1).map(l=>l.book).join(' + '):b.legs[Number(v)-1]?.book||label)}</b><small>Uitbetaling ${euro(E.payoutFor(temp,v))} · Netto ${euro(E.profit(temp))}</small></span></label>`}).join('')}</div><div style="margin-top:12px">${field('Afrekendatum','settledDate',today(),'date')}</div><p class="form-error" id="form-error"></p></form>`,'✓ Bet afronden');}
function insertDelete(){const a=overlay.querySelector('.modal-actions');if(a)a.insertAdjacentHTML('afterbegin','<button type="button" class="btn danger" data-action="delete-item" style="margin-right:auto">Verwijderen</button>');}
function closeModal(){overlay.innerHTML='';}
function formError(message){const err=document.getElementById('form-error');if(err){err.textContent=message;err.scrollIntoView({block:'nearest',behavior:'smooth'});}toast(message,'error');}
function saveForm(f){const fd=new FormData(f),g=name=>String(fd.get(name)||'').trim(),kind=f.dataset.kind;
 if(kind==='bet'){
  const type=g('type'),count=type==='2way'?2:3,winner=g('winner');const old=data.bets.find(b=>b.id===f.dataset.id);
  if(!g('event')||!g('date'))return formError('Vul een wedstrijd en datum in.');
  if(type==='2plus3'&&old?.type!=='2plus3')return formError('2+3-way kan niet meer als nieuwe bet worden aangemaakt.');
  const legs=[];
  for(let i=0;i<count;i++){
   const odd=num(g('odd'+i)),stake=num(g('stake'+i)),freebet=num(g('free'+i)),book=g('book'+i);
   if(!book||odd<=1||stake<0||freebet<0||freebet>stake||stake===0)return formError('Vul voor elke bet een bookmaker, odd > 1 en een inzet > 0 in. Freebet mag niet hoger zijn dan totale inzet.');
   legs.push({book,odd,stake,freebet});
  }
  const valid=type==='2way'?['open','1','2']:type==='3way'?['open','1','2','3']:['open','1','23'];
  if(!valid.includes(winner))return formError('Kies een geldige winnaar voor het type bet.');
  const rec={id:old?.id||id(),createdAt:old?.createdAt||new Date().toISOString(),date:g('date'),event:g('event'),endAt:g('endAt'),type,legs,winner,settledDate:winner==='open'?'':(g('settledDate')||today())};
  const warnings=marginWarnings(rec,old?.id);
  if(warnings.length&&!confirm('WAARSCHUWING: één of meer bookmakergrenzen worden mogelijk overschreden:\n\n'+warnings.join('\n')+'\n\nToch opslaan?'))return;
  if(old)Object.assign(old,rec);else data.bets.push(rec);
 }else if(kind==='settle'){
  const b=data.bets.find(b=>b.id===f.dataset.id);if(!b)return;
  b.winner=g('winner');b.settledDate=g('settledDate')||today();
 }else if(kind==='book'){
  const name=g('name');if(!name)return formError('Vul een bookmakernaam in.');
  const old=f.dataset.old;if(data.books.some(b=>E.key(b.name)===E.key(name)&&E.key(b.name)!==E.key(old)))return formError('Deze bookmaker bestaat al.');
  if(old){const b=data.books.find(b=>E.key(b.name)===E.key(old));if(!b)return;b.name=name;
   data.bets.forEach(bet=>bet.legs.forEach(l=>{if(E.key(l.book)===E.key(old))l.book=name}));data.flows.forEach(x=>{if(E.key(x.book)===E.key(old))x.book=name});data.casinos.forEach(x=>{if(E.key(x.book)===E.key(old))x.book=name});
  }else data.books.push({id:id(),name,actual:null});
 }else if(kind==='check'){
  const b=data.books.find(x=>E.key(x.name)===E.key(f.dataset.old));if(!b)return;
  b.actual=g('actual')===''?null:E.money(num(g('actual')));
 }else if(kind==='flow'){
  const amount=num(g('amount'));if(amount<=0||!g('book'))return formError('Voer een bedrag groter dan €0 en een bookmaker in.');
  const old=data.flows.find(x=>x.id===f.dataset.id),entry={id:old?.id||id(),date:g('date'),book:g('book'),type:g('type'),amount:E.money(amount),note:g('note')};
  if(old)Object.assign(old,entry);else data.flows.push(entry);
 }else if(kind==='casino'){
  if(g('amount')===''||!Number.isFinite(Number(g('amount').replace(',','.'))))return formError('Vul een geldig bedrag in.');
  const old=data.casinos.find(x=>x.id===f.dataset.id),entry={id:old?.id||id(),date:g('date'),book:g('book'),category:g('category')||'casino',amount:E.money(num(g('amount'))),note:g('note')};
  if(old)Object.assign(old,entry);else data.casinos.push(entry);
 }
 persist();closeModal();render();toast(kind==='bet'?'Bet opgeslagen':kind==='settle'?'Bet afgerond':kind==='check'?'Saldo gecontroleerd':'Mutatie opgeslagen');if(view==='calculator')recalc();
}
function backUp(){const file='surebet-backup-'+today()+'.json';const content=JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2);const blob=new Blob([content],{type:'application/json'});
 if(navigator.canShare&&navigator.share){const f=new File([blob],file,{type:'application/json'});if(navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Surebet back-up'}).catch(()=>{});return;}}
 const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=file;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);
}
async function restore(file){if(!file)return;try{const incoming=JSON.parse(await file.text());if(!validState(incoming))throw Error('Dit is geen geldig Surebet back-upbestand.');if(!confirm('Je huidige gegevens vervangen door deze back-up? Maak zo nodig eerst een back-up van de huidige versie.'))return;data={version:3,books:incoming.books,bets:incoming.bets,flows:incoming.flows,casinos:incoming.casinos,settings:incoming.settings||defaultSettings()};normalizeData();applyTheme();persist();goto('dashboard');toast('Back-up hersteld');}catch(e){alert('Importeren mislukt: '+e.message)}}
function expiredBets(){const now=new Date();return data.bets.filter(b=>!E.settled(b)&&b.endAt&&!isNaN(new Date(b.endAt).getTime())&&new Date(b.endAt).getTime()<now.getTime());}
function renderExpiryBanner(){document.getElementById('expiry-alert')?.remove();if(!data.settings.reminderEnabled)return;const ex=expiredBets();if(!ex.length)return;
 const box=document.createElement('div');box.id='expiry-alert';box.className='banner warn expiry-banner';box.innerHTML=`<div><b>${ex.length} verlopen open bet${ex.length===1?'':'s'}</b><div class="small">${esc(ex.slice(0,2).map(x=>x.event).join(' · '))}${ex.length>2?' · …':''}</div></div><button class="btn small" data-action="show-expired">Bekijk</button><button class="btn small subtle" data-action="dismiss-expired">✕</button>`;
 try{if(sessionStorage.getItem('surebets-dismiss-expired')===today())return;}catch(_){}el.prepend(box);
}
function maybeNotifyExpired(){if(!data.settings.reminderEnabled)return;const ex=expiredBets();if(!ex.length)return;const time=data.settings.reminderHour||'21:00',h=Number(time.split(':')[0]),m=Number(time.split(':')[1]),now=new Date();if(now.getHours()*60+now.getMinutes()<h*60+m)return;
 const k='surebets-expired-notified-'+today();try{if(localStorage.getItem(k))return;localStorage.setItem(k,'1');}catch(_){}
 if(data.settings.notificationEnabled&&'Notification' in window&&Notification.permission==='granted'&&document.visibilityState==='visible'){try{new Notification('Surebets: open bets verlopen',{body:`${ex.length} bet${ex.length===1?'':'s'} wachten op afhandeling.`,icon:'./icon-192.png'});}catch(_){}}
}
function configSave(key,value){data.settings[key]=value;persist();}
function showMore(){menuOpen=!menuOpen;shell()}
document.addEventListener('click',e=>{
 const nav=e.target.closest('[data-nav]');if(nav){goto(nav.dataset.nav);return}
 const action=e.target.closest('[data-action]');if(!action)return;const a=action.dataset.action,recordId=action.dataset.id;
 switch(a){case 'more':showMore();break;
 case 'new-bet':goto('bets');openBet(null);break;case 'wizard-next':stepWizard(1);break;case 'wizard-back':stepWizard(-1);break;case 'edit-bet':openBet(data.bets.find(b=>b.id===recordId));break;case 'settle-bet':settleBet(data.bets.find(b=>b.id===recordId));break;
 case 'new-book':openBook('');break;case 'edit-book':openBook(action.dataset.name);break;case 'check-book':openBook(action.dataset.name,true);break;
 case 'new-flow':openFlow(null);break;case 'edit-flow':openFlow(data.flows.find(x=>x.id===recordId));break;
 case 'new-casino':openCasino(null);break;case 'edit-casino':openCasino(data.casinos.find(x=>x.id===recordId));break;
 case 'close-modal':closeModal();break;
 case 'delete-item':{const f=document.getElementById('entry-form');if(!f)return;const k=f.dataset.kind,idv=f.dataset.id,arr=k==='bet'?'bets':k==='flow'?'flows':k==='casino'?'casinos':null;if(arr&&confirm('Deze registratie definitief verwijderen?')){data[arr]=data[arr].filter(x=>x.id!==idv);persist();closeModal();render();toast('Registratie verwijderd')}break;}
 case 'show-expired':goto('bets');filter='open';sort='oldest';render();break;
 case 'dismiss-expired':try{sessionStorage.setItem('surebets-dismiss-expired',today());}catch(_){}document.getElementById('expiry-alert')?.remove();break;
 case 'enable-notifications':{if(!('Notification' in window)){alert('Browsermeldingen worden op dit apparaat niet ondersteund. In de app zelf blijven de verlopen bets zichtbaar.');break;}Notification.requestPermission().then(p=>{configSave('notificationEnabled',p==='granted');render();alert(p==='granted'?'Browsermeldingen ingeschakeld. De app moet actief zijn; voor meldingen bij volledig gesloten app is een pushdienst nodig.':'Toestemming niet verleend. Verlopen bets blijven in de app zichtbaar.');});break;}
 case 'backup':backUp();break;case 'restore':document.getElementById('restore-file').click();break;case 'show-bets':goto('bets');break;
 }
});
// Prevent losing records by allowing delete from within edit dialogs.
document.addEventListener('click',e=>{if(e.target.id==='modal-overlay'&&!document.querySelector('#entry-form[data-kind="bet"]'))closeModal()});
document.addEventListener('submit',e=>{if(e.target.id==='entry-form'){e.preventDefault();saveForm(e.target)}});
document.addEventListener('change',e=>{
 if(e.target.name==='type'&&e.target.closest('#entry-form'))fixWinOptions();
 else if(e.target.closest('#entry-form')?.dataset.kind==='bet')updateBetPreview();
 if(e.target.id==='setting-filter'){configSave('defaultBetFilter',e.target.value);render();return;}
 if(e.target.id==='setting-sort'){configSave('defaultBetSort',e.target.value);render();return;}
   if(e.target.id==='setting-theme'){configSave('theme',e.target.value);applyTheme();render();return;}
 if(e.target.id==='setting-reminders'){configSave('reminderEnabled',e.target.checked);render();return;}
 if(e.target.id==='setting-reminder-hour'){configSave('reminderHour',e.target.value||'21:00');render();return;}
 if(e.target.classList.contains('limit-input')){let b=data.books.find(x=>(x.id||x.name)===e.target.dataset.bookId);if(b){let v=e.target.value.trim();if(v!==''&&(!/^[0-9]+([.,][0-9]{1,2})?$/.test(v.trim())||num(v)<0)){alert('Gebruik een niet-negatief bedrag of laat leeg.');render();return;}b[e.target.dataset.limit]=v===''?null:E.money(num(v));persist();}return;}
 if(e.target.id==='bet-filter'){filter=e.target.value==='Open'?'open':e.target.value==='Afgerond'?'closed':'all';render()}
 if(e.target.id==='bet-sort'){sort=e.target.value==='Oudste eerst'?'oldest':'newest';render()}
 if(e.target.id==='calc-type'||e.target.id==='calc-round')recalc();
 if(e.target.id==='restore-file'){restore(e.target.files[0]);e.target.value=''}
});
document.addEventListener('input',e=>{
 if(e.target.id==='bet-search'){search=e.target.value;const pos=e.target.selectionStart;render();const input=document.getElementById('bet-search');input.focus();input.setSelectionRange(pos,pos);}
 if(e.target.classList.contains('calc-input')||e.target.id==='calc-budget')recalc();
 if(e.target.closest('#entry-form')?.dataset.kind==='bet')updateBetPreview();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
window.addEventListener('storage',e=>{if(e.key===STORAGE&&e.newValue){try{const d=JSON.parse(e.newValue);if(validState(d)){data=d;normalizeData();applyTheme();render()}}catch(_){}}});
window.matchMedia?.('(prefers-color-scheme: dark)')?.addEventListener?.('change',()=>{if(data.settings.theme==='auto')applyTheme();});
render();maybeNotifyExpired();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){render();maybeNotifyExpired();}});setInterval(()=>{if(document.visibilityState==='visible'){renderExpiryBanner();maybeNotifyExpired();}},60000);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
