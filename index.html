 };
 // Calculator v6: auto-advice in complete euro units; no arbitrary user budget.
 // We select the best ROI among small practical stake totals, then permit integer scaling.
 // For freebets, fixed freebet payoff is stake * (odd - 1); own money excludes the freebet.
 function calculator(type,odds,strategy='surebet',mode='cash',freeAmount=0,multiplier=1,roundTo=1){
  const n=type==='3way'?3:2, m=Number(multiplier), unit=Number(roundTo);
  const o=odds.slice(0,n).map(v=>Number(String(v).replace(',','.')));
  const F=Number(String(freeAmount).replace(',','.'));
  if(o.length!==n||o.some(v=>!Number.isFinite(v)||v<=1)||
    !['surebet','hedge'].includes(strategy)||!['cash','free'].includes(mode)||
    !Number.isInteger(m)||m<1||m>100||!Number.isFinite(unit)||![1,5,10].includes(unit)||
    mode==='free'&&(!Number.isFinite(F)||F<=0)) return {error:'Vul geldige odds (> 1), een positief freebetbedrag en een gehele vermenigvuldiger (1–100) in.'};
  const low=o.indexOf(Math.min(...o)),high=o.lastIndexOf(Math.max(...o));
  const freeMode=mode==='free', hedge=strategy==='hedge';
  const minTotal=50;                 // Minimum combined own-money stakes for Hedge.
  const maxInitial=500;              // Finite search band, not a user's spending budget.
  const cents=v=>Math.round((v+Number.EPSILON)*100)/100;
  const outcome=(stakes,fb)=>{
   const total=cents(stakes.reduce((a,b)=>a+b,0));
   const payout=o.map((odd,i)=>cents(stakes[i]*odd+(freeMode&&i===high?fb*(odd-1):0)));
   const profits=payout.map(v=>cents(v-total));
   return {stakes:[...stakes],total,payout,profits,minProfit:Math.min(...profits),prefProfit:profits[low]};
  };
  let best=null,scoreBest=-Infinity;
  function consider(ticks,fb){
    if(ticks.length!==n||ticks.some(x=>!Number.isInteger(x)||x<0))return;
    if(!freeMode&&ticks.some(x=>x<1))return;
    const stakes=ticks.map(x=>x*unit),r=outcome(stakes,fb);
    if(hedge&&r.total+1e-8<minTotal)return;
    if(hedge&&r.profits.some((v,i)=>i!==low&&v<-.00001))return;
    const score=hedge?(freeMode?r.prefProfit:r.prefProfit/r.total):(freeMode?r.minProfit:r.minProfit/r.total);
    if(!Number.isFinite(score))return;
    if(best===null||score>scoreBest+1e-10||
      (Math.abs(score-scoreBest)<=1e-10&&(r.total<best.total-1e-7||
        (r.total===best.total&&r.minProfit>best.minProfit+1e-7)))){
      best=r;scoreBest=score;
    }
  }
  if(!freeMode){
    const first=Math.ceil(minTotal/unit),last=Math.floor(maxInitial/unit);
    for(let t=first;t<=last;t++){
      const total=t*unit;
      if(hedge){
        const ticks=Array(n).fill(0);
        for(let i=0;i<n;i++) if(i!==low)ticks[i]=Math.max(1,Math.ceil((total/o[i]-1e-9)/unit));
        ticks[low]=t-ticks.reduce((a,b)=>a+b,0);
        consider(ticks,0);
      }else{
        const reciprocal=o.reduce((a,b)=>a+1/b,0),target=o.map(x=>total/(reciprocal*x*unit));
        const near=v=>{
          const arr=new Set();for(let d=-3;d<=3;d++)arr.add(Math.floor(v)+d);
          return [...arr].filter(x=>x>=1&&x<=t).sort((a,b)=>a-b);
        };
        if(n===2){for(const a of near(target[0]))consider([a,t-a],0)}
        else for(const a of near(target[0])) for(const b of near(target[1])) consider([a,b,t-a-b],0);
      }
    }
  }else{
    const P=F*(o[high]-1),others=[...Array(n).keys()].filter(i=>i!==high);
    if(hedge){
      // Highest odd holds the freebet, lowest odd is the profit preference.
      // Other outcomes must remain >= break-even; use minimal other stakes.
      const maxTicks=Math.floor((P+1e-8)/unit);
      const visits=new Set();
      const step=maxTicks<=25000?1:Math.ceil(maxTicks/15000);
      for(let t=0;t<=maxTicks;t+=step)visits.add(t);
      for(let t=Math.max(0,maxTicks-500);t<=maxTicks;t++)visits.add(t);
      for(let t=0;t<=Math.min(maxTicks,500);t++)visits.add(t);
      for(const t of visits){
        const ticks=Array(n).fill(0);ticks[low]=t;
        const other=others.find(i=>i!==low);
        if(other!==undefined){
          // middle outcome payout must cover *all* of the own stakes.
          ticks[other]=Math.max(0,Math.ceil((t*unit/(o[other]-1)-1e-9)/unit));
        }
        const total=ticks.reduce((a,b)=>a+b,0)*unit;
        if(total<=P+1e-8)consider(ticks,F);
      }
    }else{
      // The theoretical optimal freebet conversion equalizes gross payouts.
      // Check nearby whole-euro candidates; zero is possible when a hedge is unprofitable.
      const choices=others.map(i=>{
        const center=P/o[i]/unit,arr=new Set([0]);
        for(let d=-8;d<=8;d++)arr.add(Math.floor(center)+d);
        return [...arr].filter(x=>x>=0).sort((a,b)=>a-b);
      });
      for(const a of choices[0])for(const b of (choices[1]||[0])){
        const ticks=Array(n).fill(0);ticks[others[0]]=a;
        if(others.length>1)ticks[others[1]]=b;
        consider(ticks,F);
      }
    }
  }
  if(!best)return {error:hedge?'Geen geldige Hedge gevonden met minimaal €50 eigen inzet en break-even op de andere uitkomsten. Probeer andere odds of een hogere freebet.':'Geen geldige inzetverdeling gevonden. Controleer de odds en freebet.'};
  const scaled=outcome(best.stakes.map(x=>x*m),freeMode?F*m:0),totalFree=freeMode?cents(F*m):0;
  return {...scaled,low,high,mode,strategy,multiplier:m,roundTo:unit,freeAmount:totalFree,
    conversion:totalFree?cents(scaled.minProfit/totalFree*100):null,
    roi:scaled.total>0?cents(scaled.minProfit/scaled.total*100):null,
    preferredRoi:scaled.total>0?cents(scaled.prefProfit/scaled.total*100):null,
    baseline:best.total,searchRange:[minTotal,maxInitial]};
 }

 return {money,number,key,own,payout,totalOwn,payoutFor,settled,profit,expectedMin,winners,allBooks,perBook,report,calculator};
});

 const months=new Map();for(const b of data.bets){if(!E.settled(b))continue;const k=(b.settledDate||b.date||'onbekend').slice(0,7);months.set(k,E.money((months.get(k)||0)+E.profit(b)))}for(const c of data.casinos){const k=(c.date||'onbekend').slice(0,7);months.set(k,E.money((months.get(k)||0)+num(c.amount)))}
 const history=[...months].sort((a,b)=>a[0].localeCompare(b[0])).slice(-9),max=Math.max(1,...history.map(x=>Math.abs(x[1])));
 const checks=r.books.filter(x=>x.actual!==null),deviations=checks.filter(x=>Math.abs(x.difference)>.009);
 const warning=deviations.length?`<div class="banner warn">Bij <b>${deviations.length} bookmaker${deviations.length>1?'s':''}</b> wijkt het werkelijk opneembare saldo af. Controleer je portefeuille.</div>`:'';
 const external=data.casinos.filter(c=>!c.book).reduce((s,c)=>s+num(c.amount),0);
 const sites=[...r.books].sort((a,b)=>b.profit-a.profit);const top=Math.max(1,...sites.map(x=>Math.abs(x.profit)));
 const monthHtml=history.length?history.map(([m,n])=>`<div class="barrow"><span class="bars-label">${esc(m)}</span><div class="bartrack"><div class="barfill ${n<0?'loss':''}" style="width:${Math.max(2,Math.abs(n)/max*100)}%"></div></div><span class="bars-value ${currencyClass(n)}">${euro(n)}</span></div>`).join(''):empty('Nog geen resultaten','Rond een bet af om je winstontwikkeling te zien.');
 const bookHtml=sites.length?sites.map(x=>`<div class="barrow book-bar"><span class="bars-label" title="${esc(x.name)}">${esc(x.name)}</span><div class="bartrack"><div class="barfill ${x.profit<0?'loss':''}" style="width:${Math.max(2,Math.abs(x.profit)/top*100)}%"></div></div><span class="bars-value ${currencyClass(x.profit)}">${euro(x.profit)}</span></div>`).join(''):empty('Nog geen bookmakers','Voeg bookmakers toe via Portefeuille.');
 return pagehead('Dashboard','Financieel overzicht · bijgewerkt na elke registratie')+
 `<div class="dashboard-hero"><div><div class="hero-kicker">Totaalresultaat</div><div class="hero-number ${currencyClass(r.totalProfit)}">${euro(r.totalProfit)}</div><div class="hero-caption">${r.closed} afgeronde bets · ${r.open} openstaand</div></div><button class="btn dashboard-check" data-nav="portfolio">Controleer saldo →</button></div>
 <div class="grid dashboard-metrics">${metric('Direct opneembaar',euro(r.available),'Berekend saldo op goksites')}${metric('Open eigen inzet',euro(r.openStake),'Geld in open bets')}${metric('Winst uit bets',euro(r.betProfit),r.closed+' afgerond',currencyClass(r.betProfit))}${metric('Bijzondere mutaties',euro(r.casinoProfit),'Inclusief kosten',currencyClass(r.casinoProfit))}</div>
 <div class="dashboard-secondary"><span><b>${r.bets}</b> bets totaal</span><span><b>${r.roi.toLocaleString('nl-NL')}%</b> ROI afgerond</span><span><b>${euro(r.portfolio)}</b> portefeuillewaarde</span></div>${warning}
 ${external?`<div class="banner warn">Bijzondere mutaties zonder bookmaker (${euro(external)}) tellen mee in de totale winst, maar niet in het saldo van goksites.</div>`:''}
 <div class="cols2"><section><div class="sectionhead"><h2>Winst per maand</h2></div><div class="card">${monthHtml}</div></section><section><div class="sectionhead"><h2>Winst per bookmaker</h2><span class="small muted">Alle ${sites.length} sites</span></div><div class="card">${bookHtml}</div></section></div>
 <div class="sectionhead"><h2>Saldo per bookmaker</h2><button class="btn small" data-nav="portfolio">Bekijk portefeuille</button></div><div class="dashboard-books">${sites.map(x=>`<div class="dashboard-book"><strong>${esc(x.name)}</strong><span>${euro(x.available)} opneembaar</span><b class="${currencyClass(x.profit)}">${euro(x.profit)} resultaat</b></div>`).join('')}</div>`;
}
function sortBets(a,b){return sort==='oldest'?(a.date||'').localeCompare(b.date||'')||String(a.createdAt||'').localeCompare(String(b.createdAt||'')):(b.date||'').localeCompare(a.date||'') || String(b.createdAt||'').localeCompare(String(a.createdAt||'')) || String(a.id).localeCompare(String(b.id))}
function compactBets(items){return items.length?`<div class="bet-list">${items.map(betCard).join('')}</div>`:empty('Nog geen bets','Voeg hierboven je eerste bet toe.');}
function betCard(b){const isSettled=E.settled(b),win=E.winners(b),expected=E.expectedMin(b),p=E.profit(b);
 const own=E.totalOwn(b),legs=Array.isArray(b.legs)?b.legs:[],hasLegacy=b.type==='2plus3';
 const label=b.type==='1way'?'1-way':b.type==='3way'?'3-way':hasLegacy?'2-way (historisch 2+3)':'2-way';
 const desc=isSettled?(win.length?`${win.map(i=>legs[i]?.book).filter(Boolean).join(' + ')} wint`:'Verloren — geen uitbetaling'):legs.map(l=>l.book).filter(Boolean).join(' · ');
 return `<article class="bet-card"><div class="bet-top"><div class="bet-head-main"><div class="bet-name">${esc(b.event||'Wedstrijd')}</div><div class="bet-meta">${dateFmt(b.date)} · ${label}</div><div class="bet-preview-books">${esc(desc)}</div></div><span class="tag ${isSettled?'good':'open'}">${isSettled?'Afgerond':b.endAt&&new Date(b.endAt)<new Date()?'Verlopen':'Open'}</span></div>
 <div class="bet-card-sum"><div><span>Eigen inzet</span><strong>${euro(own)}</strong></div><div><span>${isSettled?'Resultaat':b.type==='1way'?'Bij verlies':'Min. verwacht'}</span><strong class="${currencyClass(isSettled?p:expected)}">${expected===null&&!isSettled?'—':euro(isSettled?p:expected)}</strong></div></div>
 <div class="bet-foot"><div class="bet-actions">${!isSettled?`<button class="btn primary" data-action="settle-bet" data-id="${esc(b.id)}">✓ Afronden</button>`:''}<button class="btn subtle" data-action="edit-bet" data-id="${esc(b.id)}">Bewerken</button></div></div>
 <details class="bet-details"><summary>Inzetten en odds bekijken</summary><div class="bet-legbox">${legs.map((l,i)=>`<div class="bet-leg ${win.includes(i)?'winner':''}"><div class="leg-name">${win.includes(i)?'✓ ':''}${esc(l.book)}</div><div class="leg-detail">Bet ${i+1} · odd ${num(l.odd).toLocaleString('nl-NL')}<br>Inzet ${euro(l.stake)}${num(l.freebet)?`<br>Freebet ${euro(l.freebet)}`:''}</div></div>`).join('')}</div></details></article>`;
}

 return pagehead('Bets','Startweergave instelbaar via Instellingen · filters zijn altijd aanpasbaar',btn('＋ Nieuwe bet','new-bet','primary'))+
 `<div class="toolbar"><input aria-label="Zoeken in bets" id="bet-search" class="fieldinput searchbox" placeholder="Zoek wedstrijd of bookmaker" value="${esc(search)}"><select id="bet-filter" class="fieldinput" style="width:auto">${opts(['Alle','Open','Afgerond'],filter==='open'?'Open':filter==='closed'?'Afgerond':'Alle')}</select><select id="bet-sort" class="fieldinput" style="width:auto">${opts(['Nieuwste eerst','Oudste eerst'],sort==='newest'?'Nieuwste eerst':'Oudste eerst')}</select></div><p class="muted small" style="margin-bottom:12px">${list.length} bets zichtbaar · ${r.bets} totaal · ${r.open} openstaand</p>${compactBets(list)}`;

 `<div class="grid">${metric('Berekend opneembaar',euro(r.available),'Volgens je administratie')}${metric('Openstaande inzet',euro(r.openStake),'Eigen geld in open bets')}${metric('Totaal op goksites',euro(r.portfolio),'Opneembaar + openstaand')}${metric('Afwijkingen',String(mismatch.length),mismatch.length?'Boekmakers wijken af':'Geen afwijkingen bij gecontroleerde sites',mismatch.length?'negative':'positive')}</div>

function flowsPage(r){const entries=data.flows.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
 const budgetRaw=data.settings?.ownMoneyBudget;
 const hasBudget=budgetRaw!==null&&budgetRaw!==undefined&&budgetRaw!==''&&Number.isFinite(Number(budgetRaw));
 const budget=hasBudget?E.money(Number(budgetRaw)):null;
 // ING is a calculated remainder of the self-imposed budget, not a bank connection.
 const ingFree=hasBudget?E.money(budget-r.netDeposits):null;
 return pagehead('Stortingen & opnames','Je geld bij bookmakers en je resterende eigen budget',btn('＋ Mutatie','new-flow','primary'))+
 `<div class="grid budget-summary">${metric('Totaal bij bookmakers',euro(r.portfolio),'Opneembaar + eigen inzet in open bets')}${metric('Eigen budget',hasBudget?euro(budget):'Nog instellen','Maximaal eigen geld om te gebruiken')}${metric('Nog vrij op ING (berekend)',hasBudget?euro(ingFree):'—','Budget min netto gestort',hasBudget?currencyClass(ingFree):'')}</div>

 <div class="sectionhead"><h2>Mutatieoverzicht</h2></div>${entries.length?`<div class="tablebox"><table><thead><tr><th>Datum</th><th>Goksite</th><th>Soort</th><th class="right">Bedrag</th><th></th></tr></thead><tbody>${entries.map(f=>`<tr><td>${dateFmt(f.date)}</td><td>${esc(f.book)}</td><td><span class="tag ${f.type==='withdrawal'?'open':'good'}">${f.type==='withdrawal'?'Opname':'Storting'}</span></td><td class="right">${euro(f.amount)}</td><td class="right"><button class="btn small subtle" data-action="edit-flow" data-id="${esc(f.id)}">Wijzig</button></td></tr>`).join('')}</tbody></table></div>`:empty('Geen stortingen','Voeg je eerste storting toe.')}`;
}

function calcDraft(){try{const v=JSON.parse(localStorage.getItem(CALC_DRAFT_KEY)||'null');return v&&typeof v==='object'?v:null}catch(_){return null}}
function saveCalcDraft(){
 if(!document.getElementById('calc-type'))return;
 const v={type:document.getElementById('calc-type').value,
  strategy:document.getElementById('calc-strategy')?.value,
  mode:document.getElementById('calc-mode')?.value,
  freeAmount:document.getElementById('calc-free-amount')?.value,
  round:document.getElementById('calc-round')?.value,
  multiplier:document.getElementById('calc-multiplier')?.value,
  customMultiplier:document.getElementById('calc-custom-multiplier')?.value,
  legs:[0,1,2].map(i=>({odd:document.getElementById('calc-odd-'+i)?.value??''}))};
 try{localStorage.setItem(CALC_DRAFT_KEY,JSON.stringify(v))}catch(e){console.warn('Rekentoolinvoer kon niet worden bewaard',e)}
}
function calcPage(){
 const draft=calcDraft(), val=(v,f)=>esc(v===null||v===undefined?f:v),
  type=draft?.type==='3way'?'3way':'2way',strategy=draft?.strategy==='hedge'?'hedge':'surebet';
 const previousFree=Array.isArray(draft?.legs)?draft.legs.reduce((s,l)=>s+(Number(String(l.free||0).replace(',','.'))||0),0):0;
 const mode=['cash','free'].includes(draft?.mode)?draft.mode:previousFree>0?'free':'cash';
 const freeAmount=val(draft?.freeAmount,previousFree||'50');
 const round=['1','5','10'].includes(String(draft?.round))?String(draft.round):'1';
 const multiplier=['1','2','3','custom'].includes(String(draft?.multiplier))?String(draft.multiplier):'1';
 return pagehead('Rekentool','De app adviseert zelf inzetten in hele euro’s','')+
 `<div class="card"><div class="formgrid">
 <div class="field"><label for="calc-type">Type weddenschap</label><select class="fieldinput" id="calc-type"><option value="2way" ${type==='2way'?'selected':''}>2-way</option><option value="3way" ${type==='3way'?'selected':''}>3-way</option></select></div>
 <div class="field"><label for="calc-strategy">Strategie</label><select class="fieldinput" id="calc-strategy"><option value="surebet" ${strategy==='surebet'?'selected':''}>Surebet — maximaal minimumrendement</option><option value="hedge" ${strategy==='hedge'?'selected':''}>Hedge — laagste odd voor winst</option></select></div>
 <div class="field"><label for="calc-mode">Soort inzet</label><select class="fieldinput" id="calc-mode"><option value="cash" ${mode==='cash'?'selected':''}>Eigen geld</option><option value="free" ${mode==='free'?'selected':''}>Freebet</option></select></div>
 <div class="field"><label for="calc-round">Afronden op</label><select class="fieldinput" id="calc-round"><option value="1" ${round==='1'?'selected':''}>€ 1 (hele euro’s)</option><option value="5" ${round==='5'?'selected':''}>€ 5</option><option value="10" ${round==='10'?'selected':''}>€ 10</option></select></div>
 </div><div class="divider"></div>
 <div class="miniheading">Odds invoeren</div>
 <p class="helper">Vul alleen de odds in; het bedrag wordt automatisch geadviseerd. Bij Hedge gaat de meeste winst naar de <b>laagste odd</b>, terwijl de overige uitkomsten minimaal break-even spelen. De totale eigen inzet bij Hedge is minstens € 50.</p>
 <div class="calc-quick-odds" id="calc-legs" style="grid-template-columns:repeat(${type==='3way'?3:2},minmax(0,1fr))">${[0,1,2].map(i=>`<div class="field" data-legrow="${i}" ${i===2&&type==='2way'?'style="display:none"':''}>

 <div id="calc-free-group" class="field" style="margin-top:14px;${mode==='free'?'':'display:none'}"><label for="calc-free-amount">Freebet op de hoogste odd (€)</label><input id="calc-free-amount" class="fieldinput" inputmode="decimal" value="${freeAmount}" placeholder="50" autocomplete="off"><p class="helper">Bij winst wordt de gratis inzet zelf niet terugbetaald. De app zet de freebet automatisch op de hoogste odd en berekent de eigen hedges.</p></div>
 <div class="divider"></div><div class="field"><label>Vermenigvuldiger</label><input type="hidden" id="calc-multiplier" value="${multiplier}">
 <div class="calc-multi-buttons" aria-label="Vermenigvuldiger">${[['1','1×'],['2','2×'],['3','3×'],['custom','Zelf']].map(([value,label])=>`<button type="button" class="btn calc-multi-btn ${multiplier===value?'on':''}" data-calc-multi="${value}" aria-pressed="${multiplier===value?'true':'false'}">${label}</button>`).join('')}</div></div>
 <div class="field" id="calc-custom-group" style="margin-top:12px;${multiplier==='custom'?'':'display:none'}"><label for="calc-custom-multiplier">Eigen vermenigvuldiger (geheel getal 1–100)</label><input id="calc-custom-multiplier" class="fieldinput" inputmode="numeric" value="${val(draft?.customMultiplier,'4')}" autocomplete="off"></div>

// Calendar month grouping: settled bets use settlement date; open bets use the
// planned end date, falling back to the date the bet was placed.
function betMonth(b){const date=E.settled(b)?(b.settledDate||b.date):(b.endAt||b.date);return String(date||'').slice(0,7)}
function bookMonthResult(name,month){
 const k=E.key(name);let amount=0;
 for(const b of data.bets){
  if(!E.settled(b)||betMonth(b)!==month)continue;
  const winners=E.winners(b);
  b.legs.forEach((leg,i)=>{if(E.key(leg.book)===k)amount+=(winners.includes(i)?E.payout(leg):0)-E.own(leg)});
 }
 for(const entry of data.casinos)if(E.key(entry.book)===k&&String(entry.date||'').slice(0,7)===month)amount+=num(entry.amount);
 return E.money(amount);
}
function marginWarnings(b,excludedId){
 const warnings=[];
 const month=betMonth(b)||today().slice(0,7);
 const scenarioGroups=bet=>bet.type==='1way'?[[0],[]]:bet.type==='3way'?[[0],[1],[2]]:bet.type==='2plus3'?[[0],[1,2]]:[[0],[1]];
 const outcomeRange=(bet,k)=>{
  const idx=bet.legs.map((l,i)=>E.key(l.book)===k?i:-1).filter(i=>i>=0);
  if(!idx.length)return [0,0];
  const scenarios=E.settled(bet)?[E.winners(bet)]:scenarioGroups(bet);
  const results=scenarios.map(win=>E.money(idx.reduce((v,i)=>v+(win.includes(i)?E.payout(bet.legs[i]):0)-E.own(bet.legs[i]),0)));
  return [Math.min(...results),Math.max(...results)];
 };
 for(const book of data.books){
  const maxP=book.maxProfit==null||book.maxProfit===''?null:num(book.maxProfit);
  const maxL=book.maxLoss==null||book.maxLoss===''?null:num(book.maxLoss);
  if(maxP===null&&maxL===null)continue;
  const k=E.key(book.name);
  // Already settled bets and special mutations in this particular month.
  let base=0;
  for(const existing of data.bets){if(existing.id===excludedId||!E.settled(existing)||betMonth(existing)!==month)continue;const [mn]=outcomeRange(existing,k);base+=mn;}
  for(const change of data.casinos){if(E.key(change.book)===k&&String(change.date||'').slice(0,7)===month)base+=num(change.amount);}
  // Existing pending bets contribute their conservative best and worst cases.
  let outstandingMin=0,outstandingMax=0;
  for(const pending of data.bets){if(E.settled(pending)||pending.id===excludedId||betMonth(pending)!==month)continue;const [mn,mx]=outcomeRange(pending,k);outstandingMin+=mn;outstandingMax+=mx;}
  const [newMin,newMax]=outcomeRange(b,k);
  if(newMin===0&&newMax===0)continue;
  const min=E.money(base+outstandingMin+newMin),max=E.money(base+outstandingMax+newMax);
  if(maxP!==null&&max>maxP+.009)warnings.push(`${book.name} (${month}): mogelijk maandresultaat ${euro(max)} > winstgrens ${euro(maxP)}`);
  if(maxL!==null&&min< -maxL-.009)warnings.push(`${book.name} (${month}): mogelijk maandresultaat ${euro(min)} < verliesgrens −${euro(maxL)}`);
 }
 return [...new Set(warnings)];
}

function settleBet(b){
 if(!b)return;
 const choices=b.type==='1way'?[['1','Gewonnen'],['loss','Verloren']]:b.type==='2way'?[['1','Bet 1'],['2','Bet 2']]:b.type==='3way'?[['1','Bet 1'],['2','Bet 2'],['3','Bet 3']]:[['1','Bet 1'],['23','Bet 2 + 3']];
 modal('Uitslag: '+b.event,`<form id="entry-form" data-kind="settle" data-id="${esc(b.id)}"><p class="helper">Kies de uitkomst. Daarna controleer je de nieuwe berekende saldi voordat je deze bevestigt.</p><div class="winner-choice">${choices.map(([v,label])=>{const temp={...b,winner:v};const title=v==='loss'?'Verloren — geen bookmaker wint':v==='23'?b.legs.slice(1).map(l=>l.book).join(' + '):b.legs[Number(v)-1]?.book||label;return `<label class="winner-option"><input type="radio" name="winner" value="${v}" required><span><b>${esc(title)}</b><small>Uitbetaling ${euro(E.payoutFor(temp,v))} · Netto ${euro(E.profit(temp))}</small></span></label>`}).join('')}</div><div style="margin-top:12px">${field('Afrekendatum','settledDate',today(),'date')}</div><p class="form-error" id="form-error"></p></form>`,'Controleer saldi →');
}
function openSettlementReview(rec,oldBet=null){
 // All changes are only committed after a clear choice. The last verified actual balance is preserved on "Niet akkoord".
 const original=oldBet||data.bets.find(b=>b.id===rec.id)||null;
 const before=new Map(E.allBooks(data).map(name=>[E.key(name),E.perBook(data,name)]));
 const proposed=structuredClone(data),found=proposed.bets.find(b=>b.id===rec.id);
 if(found)Object.assign(found,rec);else proposed.bets.push(rec);
 const affected=[...new Set([...rec.legs.map(l=>l.book),...(original?.legs||[]).map(l=>l.book)].filter(Boolean))];
 const differences=affected.map(name=>{
  const was=before.get(E.key(name))||{available:0,actual:null};
  const after=E.perBook(proposed,name);
  return {name,was,after,delta:E.money(after.available-was.available)};
 }).filter(x=>Math.abs(x.delta)>.009);
 pendingSettlement={record:structuredClone(rec),rows:differences};
 const rows=differences.map(x=>`<tr><td>${esc(x.name)}</td><td class="right">${euro(x.was.available)}</td><td class="right ${currencyClass(x.delta)}">${euro(x.after.available)}</td></tr>`).join('');
 const checkable=differences.filter(x=>x.delta>.009);
 const checkedRows=checkable.map(x=>`<div class="balance-review-book"><b>${esc(x.name)}</b><div>Nieuw berekend opneembaar: <strong>${euro(x.after.available)}</strong></div><div class="small muted">Laatst handmatig gecontroleerd: ${x.was.actual===null?'nog niet ingevuld':euro(x.was.actual)}</div></div>`).join('');
 const body=`<div class="review-result"><span>Nettoresultaat van deze bet</span><strong class="${currencyClass(E.profit(rec))}">${euro(E.profit(rec))}</strong></div>
 <p class="helper" style="margin:12px 0">Dit is de <b>berekende</b> saldocorrectie na het afronden. Verloren inzetten zijn bij het plaatsen al afgeschreven.</p>
 ${rows?`<div class="tablebox"><table><thead><tr><th>Bookmaker</th><th class="right">Voor</th><th class="right">Na</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="banner">Er is geen nieuwe uitbetaling. Het berekende saldo verandert niet.</div>'}
 ${checkable.length?`<div class="sectionhead"><h3>Komt de uitbetaling overeen met je saldo?</h3></div>${checkedRows}<p class="helper" style="margin-top:10px"><b>Akkoord:</b> de getoonde opneembare saldi worden als gecontroleerd opgeslagen. <b>Niet akkoord:</b> de bet wordt wel afgerond, maar de vorige gecontroleerde saldi blijven ongewijzigd. Je kunt ze later bij Portefeuille controleren.</p>`:'<p class="helper" style="margin-top:10px">Bij deze afrekening is geen winnende uitbetaling bij een bookmaker. Je kunt de bet afronden zonder de gecontroleerde saldi te wijzigen.</p>'}`;
 modal('Controleer resultaat & saldo',body,'');
 const actions=overlay.querySelector('.modal-actions');
 actions.innerHTML=`<button type="button" class="btn subtle" data-action="settlement-back">← Terug</button><button type="button" class="btn" data-action="settlement-reject">${checkable.length?'Niet akkoord · oude stand':'Afronden'}</button>${checkable.length?'<button type="button" class="btn primary" data-action="settlement-accept">Akkoord · saldo bijwerken</button>':''}`;
}
function finishSettlement(accept){
 if(!pendingSettlement)return;
 const pending=pendingSettlement;pendingSettlement=null;
 const rec=pending.record,old=data.bets.find(b=>b.id===rec.id);
 if(old)Object.assign(old,rec);else data.bets.push(rec);
 if(accept){
  for(const row of pending.rows.filter(x=>x.delta>.009)){
   let book=data.books.find(b=>E.key(b.name)===E.key(row.name));
   if(!book){book={id:id(),name:row.name,actual:null};data.books.push(book)}
   book.actual=E.perBook(data,row.name).available;
  }
 }
 persist();closeModal();render();toast(accept?'Bet afgerond; gecontroleerd saldo bijgewerkt':'Bet afgerond; vorige saldostand behouden');
}

function insertDelete(){const a=overlay.querySelector('.modal-actions');if(a)a.insertAdjacentHTML('afterbegin','<button type="button" class="btn danger" data-action="delete-item" style="margin-right:auto">Verwijderen</button>');}
function closeModal(){overlay.innerHTML='';pendingSettlement=null;}
function formError(message){const err=document.getElementById('form-error');if(err){err.textContent=message;err.scrollIntoView({block:'nearest',behavior:'smooth'});}toast(message,'error');}
function saveForm(f){const fd=new FormData(f),g=name=>String(fd.get(name)||'').trim(),kind=f.dataset.kind;
 if(kind==='bet'){
  const type=g('type'),count=type==='1way'?1:type==='2way'?2:3,winner=g('winner');const old=data.bets.find(b=>b.id===f.dataset.id);
  if(!g('event')||!g('date'))return formError('Vul een wedstrijd en datum in.');
  if(type==='2plus3'&&old?.type!=='2plus3')return formError('2+3-way kan niet meer als nieuwe bet worden aangemaakt.');
  const legs=[];
  for(let i=0;i<count;i++){
   const odd=num(g('odd'+i)),stake=num(g('stake'+i)),freebet=num(g('free'+i)),book=g('book'+i);
   if(!book||odd<=1||stake<0||freebet<0||freebet>stake||stake===0)return formError('Vul voor elke bet een bookmaker, odd > 1 en een inzet > 0 in. Freebet mag niet hoger zijn dan totale inzet.');
   legs.push({book,odd,stake,freebet});
  }
  const valid=type==='1way'?['open','1','loss']:type==='2way'?['open','1','2']:type==='3way'?['open','1','2','3']:['open','1','23'];
  if(!valid.includes(winner))return formError('Kies een geldige winnaar voor het type bet.');
  const rec={id:old?.id||id(),createdAt:old?.createdAt||new Date().toISOString(),date:g('date'),event:g('event'),endAt:g('endAt'),type,legs,winner,settledDate:winner==='open'?'':(g('settledDate')||today())};
  const warnings=marginWarnings(rec,old?.id);
  if(warnings.length&&!confirm('WAARSCHUWING: één of meer bookmakergrenzen worden mogelijk overschreden:\n\n'+warnings.join('\n')+'\n\nToch opslaan?'))return;
  if(winner!=='open'&&(!old||!E.settled(old)||old.winner!==winner||JSON.stringify(old.legs)!==JSON.stringify(rec.legs))){openSettlementReview(rec,old);return;}
  if(old)Object.assign(old,rec);else data.bets.push(rec);
 }else if(kind==='settle'){
  const b=data.bets.find(b=>b.id===f.dataset.id);if(!b)return;
  const winner=g('winner');
  const valid=b.type==='1way'?['1','loss']:b.type==='2way'?['1','2']:b.type==='3way'?['1','2','3']:['1','23'];
  if(!valid.includes(winner))return formError('Kies eerst de uitkomst.');
  const rec={...b,winner,settledDate:g('settledDate')||today()};
  openSettlementReview(rec,b);return;
 }else if(kind==='book'){
  const name=g('name');if(!name)return formError('Vul een bookmakernaam in.');
  const old=f.dataset.old;if(data.books.some(b=>E.key(b.name)===E.key(name)&&E.key(b.name)!==E.key(old)))return formError('Deze bookmaker bestaat al.');
  if(old){const b=data.books.find(b=>E.key(b.name)===E.key(old));if(!b)return;b.name=name;
   data.bets.forEach(bet=>bet.legs.forEach(l=>{if(E.key(l.book)===E.key(old))l.book=name}));data.flows.forEach(x=>{if(E.key(x.book)===E.key(old))x.book=name});data.casinos.forEach(x=>{if(E.key(x.book)===E.key(old))x.book=name});
  }else data.books.push({id:id(),name,actual:null});
 }else if(kind==='check'){
  const b=data.books.find(x=>E.key(x.name)===E.key(f.dataset.old));if(!b)return;
  b.actual=g('actual')===''?null:E.money(num(g('actual')));
  }else if(kind==='budget'){
   const raw=g('budget').trim();
   if(raw!==''&&!/^(?:\d+)(?:[.,]\d{1,2})?$/.test(raw))return formError('Vul een positief budget in, met maximaal twee decimalen.');
   const value=raw===''?null:E.money(num(raw));
   if(value!==null&&value<0)return formError('Het budget kan niet negatief zijn.');
   data.settings.ownMoneyBudget=value;
  }else if(kind==='flow'){
  const amount=num(g('amount'));if(amount<=0||!g('book'))return formError('Voer een bedrag groter dan €0 en een bookmaker in.');
  const old=data.flows.find(x=>x.id===f.dataset.id),entry={id:old?.id||id(),date:g('date'),book:g('book'),type:g('type'),amount:E.money(amount),note:g('note')};
  if(old)Object.assign(old,entry);else data.flows.push(entry);
 }else if(kind==='casino'){
  const raw=g('amount').replace(',','.');
  if(!/^\d+(?:\.\d{1,2})?$/.test(raw)||Number(raw)<=0)return formError('Voer een positief bedrag in; kies Kosten / verlies (−) om het af te trekken.');
  const signed=g('direction')==='expense'?-Number(raw):Number(raw);
  const old=data.casinos.find(x=>x.id===f.dataset.id),entry={id:old?.id||id(),date:g('date'),book:g('book'),category:g('category')||'casino',amount:E.money(signed),note:g('note')};
  if(old)Object.assign(old,entry);else data.casinos.push(entry);
 }
 persist();closeModal();render();toast(kind==='bet'?'Bet opgeslagen':kind==='settle'?'Bet afgerond':kind==='check'?'Saldo gecontroleerd':'Mutatie opgeslagen');if(view==='calculator')recalc();
}
function backUp(){const file='surebet-backup-'+today()+'.json';const content=JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2);const blob=new Blob([content],{type:'application/json'});
 if(navigator.canShare&&navigator.share){const f=new File([blob],file,{type:'application/json'});if(navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Surebet back-up'}).catch(()=>{});return;}}
 const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=file;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);
}
async function restore(file){if(!file)return;try{const incoming=JSON.parse(await file.text());if(!validState(incoming))throw Error('Dit is geen geldig Surebet back-upbestand.');if(!confirm('Je huidige gegevens vervangen door deze back-up? Maak zo nodig eerst een back-up van de huidige versie.'))return;data={version:3,books:incoming.books,bets:incoming.bets,flows:incoming.flows,casinos:incoming.casinos,settings:incoming.settings||defaultSettings()};normalizeData();applyTheme();persist();goto('dashboard');toast('Back-up hersteld');}catch(e){alert('Importeren mislukt: '+e.message)}}
function expiredBets(){const now=new Date();return data.bets.filter(b=>!E.settled(b)&&b.endAt&&!isNaN(new Date(b.endAt).getTime())&&new Date(b.endAt).getTime()<now.getTime());}
function renderExpiryBanner(){document.getElementById('expiry-alert')?.remove();if(!data.settings.reminderEnabled)return;const ex=expiredBets();if(!ex.length)return;
 const box=document.createElement('div');box.id='expiry-alert';box.className='banner warn expiry-banner';box.innerHTML=`<div><b>${ex.length} verlopen open bet${ex.length===1?'':'s'}</b><div class="small">${esc(ex.slice(0,2).map(x=>x.event).join(' · '))}${ex.length>2?' · …':''}</div></div><button class="btn small" data-action="show-expired">Bekijk</button><button class="btn small subtle" data-action="dismiss-expired">✕</button>`;
 try{if(sessionStorage.getItem('surebets-dismiss-expired')===today())return;}catch(_){}el.prepend(box);
}
function maybeNotifyExpired(){if(!data.settings.reminderEnabled)return;const ex=expiredBets();if(!ex.length)return;const time=data.settings.reminderHour||'21:00',h=Number(time.split(':')[0]),m=Number(time.split(':')[1]),now=new Date();if(now.getHours()*60+now.getMinutes()<h*60+m)return;
 const k='surebets-expired-notified-'+today();try{if(localStorage.getItem(k))return;localStorage.setItem(k,'1');}catch(_){}
 if(data.settings.notificationEnabled&&'Notification' in window&&Notification.permission==='granted'&&document.visibilityState==='visible'){try{new Notification('Surebets: open bets verlopen',{body:`${ex.length} bet${ex.length===1?'':'s'} wachten op afhandeling.`,icon:'./icon-192.png'});}catch(_){}}
}
function configSave(key,value){data.settings[key]=value;persist();}
function showMore(){menuOpen=!menuOpen;shell()}
document.addEventListener('click',e=>{
 if(e.target.closest('#cloud-header-status')){goto('settings');return;}const nav=e.target.closest('[data-nav]');if(nav){goto(nav.dataset.nav);return}
 const action=e.target.closest('[data-action]');if(!action)return;const a=action.dataset.action,recordId=action.dataset.id;
 switch(a){case 'more':showMore();break;
 case 'cloud-config-save':{const url=document.getElementById('cloud-url')?.value.trim(),key=document.getElementById('cloud-key')?.value.trim();if(!url||!key){alert('Vul Project URL en publishable key in.');break;}cloudConfig={url,key};try{localStorage.setItem(CLOUD_CONFIG_KEY,JSON.stringify(cloudConfig))}catch(e){alert('Configuratie lokaal opslaan is mislukt.');break;}cloudStart();break;}
 case 'cloud-reconfigure':{if(!confirm('Verbinding wijzigen? Je lokale administratie blijft behouden.'))break;cloudClientGeneration++;cloudClient=null;cloudUser=null;cloudActive=false;cloudDirty=false;cloudConflict=false;cloudNotify();break;}
 case 'cloud-login':cloudLogin('signin');break;case 'cloud-signup':cloudLogin('signup');break;
 case 'cloud-logout':cloudLogout();break;
 case 'cloud-sync-now':{if(cloudDirty)cloudPush();else cloudPoll();break;}
 case 'cloud-download':cloudTakeCloud().catch(err=>{cloudError=err.message;cloudNotify()});break;
 case 'cloud-upload':cloudUploadLocal().catch(err=>{cloudError=err.message;cloudNotify()});break;
 case 'calc-to-bet':calcToNewBet();break;case 'new-bet':goto('bets');openBet(null);break;case 'wizard-next':stepWizard(1);break;case 'wizard-back':stepWizard(-1);break;case 'edit-bet':openBet(data.bets.find(b=>b.id===recordId));break;case 'settle-bet':settleBet(data.bets.find(b=>b.id===recordId));break;
 case 'new-book':openBook('');break;case 'edit-book':openBook(action.dataset.name);break;case 'check-book':openBook(action.dataset.name,true);break;
  case 'set-budget':openBudget();break;
  case 'new-flow':openFlow(null);break;case 'edit-flow':openFlow(data.flows.find(x=>x.id===recordId));break;
 case 'new-casino':openCasino(null);break;case 'edit-casino':openCasino(data.casinos.find(x=>x.id===recordId));break;
 case 'settlement-accept':finishSettlement(true);break;case 'settlement-reject':finishSettlement(false);break;case 'settlement-back':{const p=pendingSettlement;pendingSettlement=null;if(p){const stored=data.bets.find(b=>b.id===p.record.id);if(stored&&!E.settled(stored))settleBet(stored);else openBet(p.record);}break;}
 case 'close-modal':closeModal();break;
 case 'delete-item':{const f=document.getElementById('entry-form');if(!f)return;const k=f.dataset.kind,idv=f.dataset.id,arr=k==='bet'?'bets':k==='flow'?'flows':k==='casino'?'casinos':null;if(arr&&confirm('Deze registratie definitief verwijderen?')){data[arr]=data[arr].filter(x=>x.id!==idv);persist();closeModal();render();toast('Registratie verwijderd')}break;}
 case 'show-expired':goto('bets');filter='open';sort='oldest';render();break;
 case 'dismiss-expired':try{sessionStorage.setItem('surebets-dismiss-expired',today());}catch(_){}document.getElementById('expiry-alert')?.remove();break;
 case 'enable-notifications':{if(!('Notification' in window)){alert('Browsermeldingen worden op dit apparaat niet ondersteund. In de app zelf blijven de verlopen bets zichtbaar.');break;}Notification.requestPermission().then(p=>{configSave('notificationEnabled',p==='granted');render();alert(p==='granted'?'Browsermeldingen ingeschakeld. De app moet actief zijn; voor meldingen bij volledig gesloten app is een pushdienst nodig.':'Toestemming niet verleend. Verlopen bets blijven in de app zichtbaar.');});break;}
 case 'backup':backUp();break;case 'restore':document.getElementById('restore-file').click();break;case 'show-bets':goto('bets');break;
 }
});
// Prevent losing records by allowing delete from within edit dialogs.
document.addEventListener('click',e=>{if(e.target.id==='modal-overlay'&&!pendingSettlement&&!document.querySelector('#entry-form[data-kind="bet"]'))closeModal()});
document.addEventListener('submit',e=>{if(e.target.id==='entry-form'){e.preventDefault();saveForm(e.target)}});
document.addEventListener('click',e=>{const btn=e.target.closest('[data-calc-multi]');if(!btn)return;const input=document.getElementById('calc-multiplier');if(!input)return;input.value=btn.dataset.calcMulti;saveCalcDraft();recalc();});
document.addEventListener('change',e=>{
 if(e.target.name==='category'&&e.target.closest('#entry-form')?.dataset.kind==='casino'&&!e.target.closest('#entry-form')?.dataset.id){const direction=e.target.closest('#entry-form').elements.direction;if(direction)direction.value=e.target.value==='service'?'expense':'income';}
 if(e.target.name==='type'&&e.target.closest('#entry-form'))fixWinOptions();
 else if(e.target.closest('#entry-form')?.dataset.kind==='bet')updateBetPreview();
 if(e.target.id==='setting-filter'){configSave('defaultBetFilter',e.target.value);render();return;}
 if(e.target.id==='setting-sort'){configSave('defaultBetSort',e.target.value);render();return;}
  if(e.target.id==='limits-month'){if(/^\d{4}-\d{2}$/.test(e.target.value)){limitMonth=e.target.value;render();}return;}
   if(e.target.id==='setting-theme'){configSave('theme',e.target.value);applyTheme();render();return;}
 if(e.target.id==='setting-reminders'){configSave('reminderEnabled',e.target.checked);render();return;}
 if(e.target.id==='setting-reminder-hour'){configSave('reminderHour',e.target.value||'21:00');render();return;}
 if(e.target.classList.contains('limit-input')){let b=data.books.find(x=>(x.id||x.name)===e.target.dataset.bookId);if(b){let v=e.target.value.trim();if(v!==''&&(!/^[0-9]+([.,][0-9]{1,2})?$/.test(v.trim())||num(v)<0)){alert('Gebruik een niet-negatief bedrag of laat leeg.');render();return;}b[e.target.dataset.limit]=v===''?null:E.money(num(v));persist();}return;}
 if(e.target.id==='bet-filter'){filter=e.target.value==='Open'?'open':e.target.value==='Afgerond'?'closed':'all';render()}
 if(e.target.id==='bet-sort'){sort=e.target.value==='Oudste eerst'?'oldest':'newest';render()}
  if(['calc-type','calc-round','calc-mode','calc-strategy'].includes(e.target.id)){saveCalcDraft();recalc();}
 if(e.target.id==='restore-file'){restore(e.target.files[0]);e.target.value=''}
});
document.addEventListener('input',e=>{
 if(e.target.id==='bet-search'){search=e.target.value;const pos=e.target.selectionStart;render();const input=document.getElementById('bet-search');input.focus();input.setSelectionRange(pos,pos);}
  if(e.target.classList.contains('calc-input')||['calc-free-amount','calc-custom-multiplier'].includes(e.target.id)){saveCalcDraft();recalc();}
 if(e.target.closest('#entry-form')?.dataset.kind==='bet')updateBetPreview();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
window.addEventListener('storage',e=>{if(e.key===STORAGE&&e.newValue){try{const d=JSON.parse(e.newValue);if(validState(d)){data=d;normalizeData();applyTheme();render()}}catch(_){}}});
window.matchMedia?.('(prefers-color-scheme: dark)')?.addEventListener?.('change',()=>{if(data.settings.theme==='auto')applyTheme();});
render();maybeNotifyExpired();cloudStart();window.addEventListener('online',()=>{if(cloudActive&&cloudDirty)cloudSchedule(100);else cloudPoll();});setInterval(()=>{if(document.visibilityState==='visible')cloudPoll()},25000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){render();maybeNotifyExpired();cloudPoll();if(cloudDirty)cloudSchedule(300);}});setInterval(()=>{if(document.visibilityState==='visible'){renderExpiryBanner();maybeNotifyExpired();}},60000);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
